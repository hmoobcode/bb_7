<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เจ็ดคริสตจักร - Seven Churches</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Sarabun', 'Phetsarath OT', sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f4f1ea;
        }

        #home-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('background.jpg');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px 20px;
            z-index: 10;
            transition: opacity 0.4s ease;
        }

        .top-bar {
            display: flex;
            justify-content: flex-end;
            width: 100%;
        }

        .lang-btn {
            background: rgba(255, 255, 255, 0.85);
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            color: #333;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: background 0.2s;
        }

        .lang-btn:hover {
            background: #fff;
        }

        .menu-container {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            margin-top: -140px; 
            background: rgba(255, 255, 255, 0.92);
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            overflow: hidden;
            width: fit-content;
            max-width: 100%;
        }

        .menu-item {
            background: transparent;
            padding: 10px 18px;
            cursor: pointer;
            font-weight: bold;
            font-size: 17px;
            color: #1a5c22;
            transition: background 0.2s;
            border-left: 4px solid #2e7d32;
            border-bottom: 1px solid #e0e0e0;
            white-space: nowrap;
        }

        .menu-item:last-child {
            border-bottom: none;
        }

        .menu-item:hover {
            background: rgba(46, 125, 50, 0.1);
        }

        .app-title-container {
            text-align: center;
            margin-bottom: 20px;
        }

        .app-title {
            font-size: 38px;
            font-weight: bold;
            color: #d32f2f;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3), 0 0 10px rgba(255, 255, 255, 0.8);
        }

        #reader-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #faf8f5;
            display: flex;
            flex-direction: column;
            z-index: 5;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        #reader-screen.active {
            opacity: 1;
            pointer-events: auto;
        }

        .reader-header {
            background-color: #4a3b32;
            color: #fff;
            padding: 12px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            gap: 10px;
        }

        .back-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
        }

        .reader-title-wrapper {
            flex-grow: 1;
            overflow: hidden; 
            position: relative;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .reader-title {
            font-size: 17px;
            font-weight: bold;
            white-space: nowrap;
            color: #fff;
            position: relative;
        }

        @keyframes one-way-slide {
            0% { transform: translateX(0); }
            100% { transform: translateX(calc(var(--overflow-width) * -1)); }
        }

        .reader-title.scrolling {
            position: absolute !important;
            left: 0;
            animation: one-way-slide 10s linear infinite;
        }

        .reader-lang-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: #fff;
            padding: 5px 10px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 13px;
            flex-shrink: 0;
        }

        .reader-content-container {
            flex-grow: 1;
            padding: 25px 20px;
            overflow-y: auto;
            line-height: 1.8;
            color: #2c2c2c;
            font-size: 16px;
            background: #fdfbf7;
        }

        .content-heading {
            font-weight: bold;
            font-size: 17px;
            color: #5c3a21;
            margin-top: 10px;
            margin-bottom: 8px;
        }

        .content-paragraph {
            text-indent: 2em;
            margin-bottom: 0px;
            text-align: justify;
        }

        .page-indicator {
            text-align: center;
            padding: 8px;
            background: #f4f1ea;
            font-size: 13px;
            color: #666;
            border-top: 1px solid #e0dbce;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div id="home-screen">
        <div class="top-bar">
            <button class="lang-btn" id="main-lang-btn" onclick="toggleLanguage()">ລາວ</button>
        </div>
        
        <div class="menu-container" id="menu-list">
        </div>

        <div class="app-title-container">
            <h1 class="app-title" id="app-title-text">เจ็ดคริสตจักร</h1>
        </div>
    </div>

    <div id="reader-screen">
        <div class="reader-header">
            <button class="back-btn" onclick="goHome()">&#10094; <span id="back-text">เมนู</span></button>
            <div class="reader-title-wrapper" id="title-wrapper">
                <div class="reader-title" id="book-title">ชื่อเรื่อง</div>
            </div>
            <button class="reader-lang-btn" id="reader-lang-toggle" onclick="toggleLanguageInReader()">ລາວ</button>
        </div>
        <div class="reader-content-container" id="reader-content">
        </div>
        <div class="page-indicator" id="page-indicator">หน้าที่ 1 / 1</div>
    </div>

    <script>
        const menus = {
            th: [
                "คริสตจักรเอเฟซัส",
                "คริสตจักรสเมอร์น่า",
                "คริสตจักรเปอร์กามัม",
                "คริสตจักรธียาทิรา",
                "คริสตจักรซาร์ดิส",
                "คริสตจักรฟีลาเดลเฟีย",
                "คริสตจักรเลาดีเซีย"
            ],
            la: [
                "ຄຣິສຕະຈັກເຟຊັດ",
                "ຄຣິສຕະຈັກສະເມີນ່າ",
                "ຄຣິສຕະຈັກເປີກາມັມ",
                "ຄຣິສຕະຈັກທິຢາທິຣາ",
                "ຄຣິສຕະຈັກຊາດິກ",
                "ຄຣິສຕະຈັກຟີລາເດນເຟຍ",
                "ຄຣິສຕະຈັກເລົາດີເຊຍ"
            ]
        };

        const appTitles = {
            th: "เจ็ดคริสตจักร",
            la: "ເຈັດຄຣິສຕະຈັກ"
        };

        const backTexts = {
            th: "เมนู",
            la: "ເມນູ"
        };

        let currentLang = 'th'; 
        let currentChapter = 0; 
        let chapterPages = [];  
        let currentPageIndex = 0; 

        function renderMenu() {
            const menuList = document.getElementById('menu-list');
            menuList.innerHTML = '';
            
            menus[currentLang].forEach((menuText, index) => {
                const item = document.createElement('div');
                item.className = 'menu-item';
                item.innerText = menuText;
                item.onclick = () => openChapter(index);
                menuList.appendChild(item);
            });

            document.getElementById('app-title-text').innerText = appTitles[currentLang];
            
            const langBtnText = currentLang === 'th' ? 'ລາວ' : 'ไทย';
            document.getElementById('main-lang-btn').innerText = langBtnText;
            document.getElementById('reader-lang-toggle').innerText = langBtnText;

            document.getElementById('back-text').innerText = backTexts[currentLang];
        }

        function toggleLanguage() {
            currentLang = currentLang === 'th' ? 'la' : 'th';
            renderMenu();
        }

        async function toggleLanguageInReader() {
            const container = document.getElementById('reader-content');
            const savedScrollTop = container.scrollTop;

            currentLang = currentLang === 'th' ? 'la' : 'th';

            await loadChapterContent(currentChapter, currentPageIndex, savedScrollTop);
            
            const langBtnText = currentLang === 'th' ? 'ລາວ' : 'ไทย';
            document.getElementById('main-lang-btn').innerText = langBtnText;
            document.getElementById('reader-lang-toggle').innerText = langBtnText;

            document.getElementById('back-text').innerText = backTexts[currentLang];
        }

        function openChapter(index) {
            currentChapter = index;
            currentPageIndex = 0; 
            
            history.pushState({ screen: 'reader', chapter: index }, "");

            document.getElementById('home-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('home-screen').classList.add('hidden');
                document.getElementById('reader-screen').classList.add('active');
                loadChapterContent(currentChapter, currentPageIndex, 0);
            }, 300);
        }

        function goHome() {
            if (document.getElementById('reader-screen').classList.contains('active')) {
                window.history.back();
            } else {
                executeGoHome();
            }
        }

        function executeGoHome() {
            document.getElementById('reader-screen').classList.remove('active');
            document.getElementById('home-screen').classList.remove('hidden');
            setTimeout(() => {
                document.getElementById('home-screen').style.opacity = '1';
            }, 50);
        }

        window.addEventListener('popstate', function(event) {
            const readerScreen = document.getElementById('reader-screen');
            if (readerScreen.classList.contains('active')) {
                executeGoHome();
            }
        });

        async function loadChapterContent(index, pageToDisplay = 0, targetScrollTop = 0) {
            const folder = currentLang; 
            const fileName = `ep${index + 1}.txt`; 
            const filePath = `${folder}/${fileName}`;

            try {
                const response = await fetch(filePath);
                if (!response.ok) throw new Error(`ไม่พบไฟล์ ${filePath}`);
                const text = await response.text();
                processTextIntoPages(text, index);
            } catch (error) {
                console.warn(error);
                const sampleText = `[${menus[currentLang][index]}]\n{หัวข้อบทที่ ${index + 1}}\nนี่คือเนื้อหาตัวอย่างบรรทัดแรกสำหรับไฟล์ ${filePath}\n[ชื่อเรื่องยาวมากๆ เพื่อทดสอบระบบซ่อนส่วนที่เกินทางขวาและสไลด์ชื่อเรื่อง]\n{ตัวอย่างหัวข้อ}\nนี่คือเนื้อหาหน้าย่อยที่ 2 เพื่อทดสอบระบบหมุนเวียน`;
                processTextIntoPages(sampleText, index);
            }

            if (pageToDisplay >= chapterPages.length) pageToDisplay = 0;
            currentPageIndex = pageToDisplay;
            displayCurrentPage(targetScrollTop);
        }

        function processTextIntoPages(rawText, index) {
            const lines = rawText.split(/\r?\n/);
            chapterPages = [];
            let currentPage = { title: menus[currentLang][index], content: "" };

            lines.forEach(line => {
                let trimmed = line.trim();
                if (!trimmed) return;

                if (trimmed.startsWith('[') && trimmed.endsWith(']')) {
                    if (currentPage.content !== "" || currentPage.title !== menus[currentLang][index]) {
                        chapterPages.push(currentPage);
                    }
                    currentPage = {
                        title: trimmed.substring(1, trimmed.length - 1),
                        content: ""
                    };
                } 
                else if (trimmed.startsWith('{') && trimmed.endsWith('}')) {
                    let headingText = trimmed.substring(1, trimmed.length - 1);
                    currentPage.content += `<div class="content-heading">${headingText}</div>`;
                } 
                else {
                    currentPage.content += `<p class="content-paragraph">${trimmed}</p>`;
                }
            });

            if (currentPage.content !== "" || chapterPages.length === 0) {
                chapterPages.push(currentPage);
            }
        }

        function displayCurrentPage(targetScrollTop = 0) {
            if (chapterPages.length === 0) return;
            
            const page = chapterPages[currentPageIndex];
            const titleElem = document.getElementById('book-title');
            const wrapperElem = document.getElementById('title-wrapper');
            const contentContainer = document.getElementById('reader-content');

            titleElem.innerText = page.title;
            contentContainer.innerHTML = page.content;
            document.getElementById('page-indicator').innerText = `หน้าที่ ${currentPageIndex + 1} / ${chapterPages.length}`;
            
            contentContainer.scrollTop = targetScrollTop;

            titleElem.classList.remove('scrolling');
            wrapperElem.style.justifyContent = 'center';

            setTimeout(() => {
                if (titleElem.scrollWidth > wrapperElem.clientWidth) {
                    wrapperElem.style.justifyContent = 'flex-start';
                    const overflowAmount = titleElem.scrollWidth - wrapperElem.clientWidth + 15;
                    titleElem.style.setProperty('--overflow-width', overflowAmount + 'px');
                    titleElem.classList.add('scrolling');
                } else {
                    wrapperElem.style.justifyContent = 'center';
                }
            }, 50);
        }

        // --- ระบบปัดซ้าย-ขวา เฉพาะแนวนอนตรงๆ เท่านั้น ---
        let touchStartX = 0;
        let touchStartY = 0;
        let touchEndX = 0;
        let touchEndY = 0;
        const readerScreen = document.getElementById('reader-screen');

        readerScreen.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, false);

        readerScreen.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            touchEndY = e.changedTouches[0].screenY;
            handleSwipe();
        }, false);

        function handleSwipe() {
            const swipeThreshold = 60; // ระยะความกว้างอย่างน้อยที่ต้องปัด
            const diffX = touchEndX - touchStartX;
            const diffY = Math.abs(touchEndY - touchStartY); // ระยะการขยับในแนวตั้ง

            // เงื่อนไข: 
            // 1. ระยะทางแนวราบต้องมากกว่าค่า Threshold
            // 2. ระยะการขยับในแนวตั้ง (diffY) ต้องน้อยกว่า 40 (แปลว่าลากเป็นเส้นตรงในแนวนอน ไม่ใช่ลากเฉียงหรือลากขึ้นลงโค้งๆ)
            if (Math.abs(diffX) > swipeThreshold && diffY < 40) {
                if (diffX < 0) {
                    // ปัดซ้าย -> ไปหน้าถัดไป
                    currentPageIndex = (currentPageIndex + 1) % chapterPages.length;
                    displayCurrentPage(0);
                } else {
                    // ปัดขวา -> กลับไปหน้าก่อนหน้า
                    currentPageIndex = (currentPageIndex - 1 + chapterPages.length) % chapterPages.length;
                    displayCurrentPage(0);
                }
            }
        }

        renderMenu();
    </script>
</body>
</html>
